name: Phase 5AI OSM Bus Stop Candidate Inventory

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/acquire_osm_road_data.py'
      - 'scripts/build_osm_boundary.py'
      - 'scripts/extract_osm_karachi_stop_candidates.py'
      - 'scripts/audit_phase5aj_historical_nodes_to_osm_stop_candidates.py'
      - 'requirements-gis.txt'
      - 'tests/test_osm_karachi_stop_candidates.py'
      - 'tests/test_phase5aj_historical_nodes_to_osm_stop_candidates.py'
  push:
    branches: [research/phase-5ai-osm-stop-candidate-inventory]
    paths:
      - '.github/workflows/phase-5ai-osm-stop-candidate-inventory.yml'
      - 'scripts/acquire_osm_road_data.py'
      - 'scripts/build_osm_boundary.py'
      - 'scripts/extract_osm_karachi_stop_candidates.py'
      - 'scripts/audit_phase5aj_historical_nodes_to_osm_stop_candidates.py'
      - 'requirements-gis.txt'
      - 'tests/test_osm_karachi_stop_candidates.py'
      - 'tests/test_phase5aj_historical_nodes_to_osm_stop_candidates.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-osm-stop-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pip-only GIS dependencies
        run: python -m pip install -r requirements-gis.txt
      - name: Download Geofabrik Pakistan PBF
        run: python scripts/acquire_osm_road_data.py --download
      - name: Build validated OSM Karachi Division boundary
        run: python scripts/build_osm_boundary.py --build
      - name: Extract OSM bus stop/platform candidates
        run: python scripts/extract_osm_karachi_stop_candidates.py --build
      - name: Audit historical 572 nodes against OSM candidates
        run: python scripts/audit_phase5aj_historical_nodes_to_osm_stop_candidates.py --build
      - name: Upload derived OSM candidate inventory (not raw PBF)
        uses: actions/upload-artifact@v4
        with:
          name: phase-5ai-osm-bus-stop-candidate-inventory
          path: |
            data/osm_source/source-metadata.json
            data/osm_boundary/karachi-division-6080948.geojson
            data/osm_stops/karachi-osm-bus-stop-candidates.geojson
            data/osm_stops/karachi-osm-bus-stop-candidates.geojson.gz
            data/osm_stops/bus-stop-candidate-extraction-report.json
            data/osm_stops/PHASE_5AJ_HISTORICAL_NODE_OSM_STOP_CANDIDATE_AUDIT.csv
            data/osm_stops/PHASE_5AJ_HISTORICAL_NODE_OSM_STOP_CANDIDATE_AUDIT_REPORT.json
          if-no-files-found: error
          retention-days: 14

  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install GIS Python packages via pip
        run: python -m pip install -r requirements-gis.txt
      - name: Run focused OSM candidate tests
        run: python -m unittest discover -s tests -p 'test_osm_karachi_stop_candidates.py' -v
      - name: Run focused historical-node proximity tests
        run: python -m unittest discover -s tests -p 'test_phase5aj_historical_nodes_to_osm_stop_candidates.py' -v
