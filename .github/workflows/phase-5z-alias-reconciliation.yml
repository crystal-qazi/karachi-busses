name: Phase 5Z User-Confirmed Alias Reconciliation

on:
  push:
    branches: [research/phase-5z-confirmed-alias-reconciliation]
    paths:
      - '.github/workflows/phase-5z-alias-reconciliation.yml'
      - 'scripts/reconcile_user_confirmed_stop_aliases.py'
      - 'data/research/PHASE_5_STOP_NODE_CROSSWALK.csv'
      - 'data/research/PHASE_5X_SPELLING_ALIAS_CANDIDATE_SHORTLIST.csv'
      - 'data/research/PHASE_5Y_USER_CONFIRMED_NAME_ALIASES.csv'
      - 'tests/test_phase5z_alias_reconciliation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Run Phase 5Z tests
        run: python -m unittest tests.test_phase5z_alias_reconciliation -v
      - name: Build derived alias reconciliation register
        if: matrix.python-version == '3.11'
        run: python scripts/reconcile_user_confirmed_stop_aliases.py --build
      - name: Upload Phase 5Z review outputs
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: phase-5z-user-confirmed-alias-reconciliation
          path: |
            data/research/PHASE_5Z_USER_CONFIRMED_ALIAS_RECONCILIATION.csv
            data/research/PHASE_5Z_USER_CONFIRMED_ALIAS_RECONCILIATION_REPORT.json
          if-no-files-found: error
          retention-days: 30
