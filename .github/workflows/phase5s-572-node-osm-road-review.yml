name: Phase 5S — 572-node OSM road review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase5s-572-node-osm-road-review.yml"
      - "scripts/build_572_node_osm_road_review.py"
      - "data/research/PHASE_5_NODE_AUDIT.csv"
      - "data/research/PHASE_5_STOP_NODE_CROSSWALK.csv"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Phase 5N OSM road extraction run ID
        required: true
        type: string
        default: "44156081494"

permissions:
  actions: read
  contents: read

jobs:
  build-572-node-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-only GIS dependencies
        run: python -m pip install -r requirements-gis.txt
      - name: Reuse existing OSM road artifact
        uses: actions/download-artifact@v4
        with:
          name: karachi-osm-road-network-research
          path: ${{ runner.temp }}/osm-road-network
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '44156081494' }}
          github-token: ${{ github.token }}
      - name: Build all-572-node proximity register
        run: |
          python scripts/build_572_node_osm_road_review.py \
            --roads "${{ runner.temp }}/osm-road-network/osm_roads/karachi-osm-bus-roads.geojson" \
            --boundary "${{ runner.temp }}/osm-road-network/osm_boundary/karachi-division-6080948.geojson" \
            --output-dir reports/phase5s
      - name: Upload review register
        uses: actions/upload-artifact@v4
        with:
          name: karachi-572-node-osm-road-review
          path: |
            reports/phase5s/karachi-572-node-osm-road-review.csv
            reports/phase5s/karachi-572-node-osm-road-review-report.json
          retention-days: 14
