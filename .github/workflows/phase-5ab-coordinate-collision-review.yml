name: Phase 5AB Coordinate Collision Review

on:
  push:
    branches: [research/phase-5ab-coordinate-collision-review]
    paths:
      - '.github/workflows/phase-5ab-coordinate-collision-review.yml'
      - 'scripts/build_phase5ab_coordinate_collision_review.py'
      - 'data/research/PHASE_5_NODE_AUDIT.csv'
      - 'tests/test_phase5ab_coordinate_collision_review.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact coordinate collision review
        run: python scripts/build_phase5ab_coordinate_collision_review.py --build
      - name: Run focused tests
        run: python -m unittest discover -s tests -p 'test_phase5ab_coordinate_collision_review.py' -v
      - name: Upload collision review outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase-5ab-coordinate-collision-review
          path: |
            data/research/PHASE_5AB_COORDINATE_COLLISION_REVIEW.csv
            data/research/PHASE_5AB_COORDINATE_COLLISION_REVIEW_REPORT.json
          if-no-files-found: error
          retention-days: 30
