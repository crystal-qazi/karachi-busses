name: Audit Karachi OSM District Boundaries

on:
  push:
    branches: [research/phase-5m-osm-district-boundary-audit]
    paths:
      - '.github/workflows/osm-district-boundary-audit.yml'
      - 'scripts/audit_osm_district_boundaries.py'
      - 'scripts/build_osm_boundary.py'
      - 'scripts/acquire_osm_road_data.py'
      - 'requirements-gis.txt'
      - 'tests/test_osm_district_boundary_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-districts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-only GIS dependencies
        run: python -m pip install -r requirements-gis.txt

      - name: Download Geofabrik Pakistan extract with Python
        run: python scripts/acquire_osm_road_data.py --download

      - name: Build and validate parent boundary
        run: python scripts/build_osm_boundary.py --build

      - name: Audit seven district subareas and build preview
        run: python scripts/audit_osm_district_boundaries.py --build

      - name: Upload research outputs (never upload regional PBF)
        uses: actions/upload-artifact@v4
        with:
          name: karachi-osm-district-boundary-audit
          path: |
            data/osm_source/source-metadata.json
            data/osm_boundary/karachi-division-6080948.geojson
            data/osm_boundary/boundary-validation.json
            data/osm_boundary/karachi-districts-osm-subareas.geojson
            data/osm_boundary/district-boundary-audit.json
            data/osm_boundary/karachi-boundary-preview.html
          if-no-files-found: error
          retention-days: 14
