services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: \${DB_NAME:-karachi_buses}
      MYSQL_USER: \${DB_USER:-karachi_buses_app}
      MYSQL_PASSWORD: \${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: \${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p\${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: \${SECRET_KEY:?Set a strong SECRET_KEY in .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: \${DB_NAME:-karachi_buses}
      DB_USER: \${DB_USER:-karachi_buses_app}
      DB_PASSWORD: \${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_CONNECT_TIMEOUT: 10
      MAP_DEFAULT_LAT: 24.8607
      MAP_DEFAULT_LNG: 67.0011
      MAP_DEFAULT_ZOOM: 11
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal]

volumes:
  mysql_data:

networks:
  internal:
